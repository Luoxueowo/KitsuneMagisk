name: Magisk CI
# Builds release + debug APKs for all ABIs and publishes a versioned GitHub Release.

on:
  push:
    branches: 
      - dev
      - kitsune
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Magisk artifacts
    runs-on: ubuntu-latest
    env:
      SCCACHE_DIRECT: false
    strategy:
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Build release
        run: ./build.py -vr all

      - name: Build debug
        run: ./build.py -v all

      - name: Stop gradle daemon
        run: ./gradlew --stop

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}
          path: out
          compression-level: 9

      - name: Upload mapping and native debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.sha }}-symbols
          path: app/build/outputs
          compression-level: 9

      # Publish a real, versioned GitHub Release on every kitsune push — one permanent
      # full release per commit (the Magisk "canary" model, shipped as legit releases).
      # Tag = v31.0-<short commit>: v31.0 tracks magisk.versionCode=31000, and the short
      # SHA is exactly the version string the APK reports (build.py: git rev-parse --short=8).
      - name: Compute version tag
        id: ver
        run: echo "tag=v31.0-$(echo '${{ github.sha }}' | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: github.ref == 'refs/heads/kitsune' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Kitsune Magisk ${{ steps.ver.outputs.tag }}
          prerelease: false
          fail_on_unmatched_files: false
          body: |
            Kitsune Magisk **v31.0** (versionCode 31000) — commit `${{ github.sha }}`.
            The short hash in the tag is the exact version this APK reports.
            Universal APKs (armeabi-v7a, arm64-v8a, x86, x86_64).

            - `app-release.apk` — release build
            - `app-debug.apk` — debug build (verbose logging)

            Built-in Zygisk support restored from LSPlt.
          files: |
            out/app-release.apk
            out/app-debug.apk
            out/stub-release.apk
            out/stub-debug.apk


